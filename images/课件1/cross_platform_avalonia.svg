<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" style="max-width:720px;margin:0 auto;display:block" role="img" aria-label="一份 C# XAML 代码可运行在多个平台">
  <defs>
    <marker id="arw4" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
  </defs>
  <!-- 中心：你的代码 -->
  <rect x="270" y="139" width="180" height="64" rx="14" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="360" y="170" text-anchor="middle" fill="#0c4a6e" font-size="17" font-weight="bold" font-family="sans-serif">你的代码</text>
  <text x="360" y="191" text-anchor="middle" fill="#0369a1" font-size="13" font-family="sans-serif">C# + XAML</text>
  <!-- 左：Web(WASM) / Android / iOS -->
  <g font-family="sans-serif">
    <!-- Web(WASM)：地球 -->
    <rect x="24" y="34" width="172" height="56" rx="12" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="62" cy="62" r="13" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <ellipse cx="62" cy="62" rx="5" ry="13" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <line x1="49" y1="62" x2="75" y2="62" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="139" y="67" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">Web(WASM)</text>
    <!-- Android：机器人头部 -->
    <rect x="24" y="142" width="172" height="56" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="62" cy="162" r="10" fill="none" stroke="#22c55e" stroke-width="2.5"/>
    <line x1="58" y1="152" x2="58" y2="147" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="66" y1="152" x2="66" y2="147" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="59" cy="162" r="1.8" fill="#22c55e"/>
    <circle cx="65" cy="162" r="1.8" fill="#22c55e"/>
    <text x="139" y="175" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">Android</text>
    <!-- iOS：手机轮廓 -->
    <rect x="24" y="250" width="172" height="56" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <rect x="54" y="265" width="16" height="24" rx="5" fill="none" stroke="#64748b" stroke-width="2.5"/>
    <circle cx="62" cy="282" r="2" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="139" y="283" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">iOS</text>
  </g>
  <!-- 右：Windows / macOS / Linux -->
  <g font-family="sans-serif">
    <!-- Windows：四窗格 -->
    <rect x="524" y="34" width="172" height="56" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect x="570" y="50" width="12" height="12" rx="2" fill="#0ea5e9"/>
    <rect x="586" y="50" width="12" height="12" rx="2" fill="#0ea5e9"/>
    <rect x="570" y="66" width="12" height="12" rx="2" fill="#0ea5e9"/>
    <rect x="586" y="66" width="12" height="12" rx="2" fill="#0ea5e9"/>
    <text x="651" y="67" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">Windows</text>
    <!-- macOS：Finder 笑脸 -->
    <rect x="524" y="142" width="172" height="56" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="586" cy="170" r="14" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="580" cy="168" r="1.8" fill="#94a3b8"/>
    <circle cx="592" cy="168" r="1.8" fill="#94a3b8"/>
    <path d="M578,174 Q586,181 594,174" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <text x="651" y="175" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">macOS</text>
    <!-- Linux：企鹅 Tux -->
    <rect x="524" y="250" width="172" height="56" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <ellipse cx="586" cy="276" rx="10" ry="12" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <ellipse cx="586" cy="279" rx="5" ry="7" fill="none" stroke="#f59e0b" stroke-width="1.8"/>
    <circle cx="582" cy="274" r="1.5" fill="#f59e0b"/>
    <circle cx="590" cy="274" r="1.5" fill="#f59e0b"/>
    <polygon points="577,276 583,280 583,272" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="595,276 589,280 589,272" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round"/>
    <text x="651" y="283" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">Linux</text>
  </g>
  <!-- 箭头：中心 → 各平台 -->
  <g stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arw4)">
    <line x1="270" y1="171" x2="198" y2="62"/>
    <line x1="270" y1="171" x2="198" y2="170"/>
    <line x1="270" y1="171" x2="198" y2="278"/>
    <line x1="450" y1="171" x2="522" y2="62"/>
    <line x1="450" y1="171" x2="522" y2="170"/>
    <line x1="450" y1="171" x2="522" y2="278"/>
  </g>
</svg>
